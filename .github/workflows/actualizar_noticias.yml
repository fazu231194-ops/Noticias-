name: Actualizar Noticias Virales

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Obtener noticias RSS
        env:
          GEMINI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/fetch_news.py

      - name: Generar sitemap
        run: python scripts/generate_sitemap.py

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "Bot de Panorama Global News"
          git config user.email "bot@users.noreply.github.com"

          git add src/data/news.json public/sitemap.xml

          if git diff --cached --quiet; then
            echo "No hay noticias nuevas para guardar."
            exit 0
          fi

          git commit -m "Actualizar noticias RSS"

          git fetch origin main
          git rebase -X theirs origin/main
          git push origin main
