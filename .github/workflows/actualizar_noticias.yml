
name: Actualizar Noticias Virales

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Obtener y redactar noticias nuevas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: python scripts/fetch_news.py

      - name: Guardar noticias nuevas
        run: |
          git config user.name "Bot de Panorama Global News"
          git config user.email "bot@users.noreply.github.com"
          git add src/data/news.json
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Actualización automática de noticias"
          git push
